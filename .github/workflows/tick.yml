name: tick
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay or skip runs under load
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test_bot.py
      - run: python bot.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "tick $(date -u +%FT%TZ)"
          git pull --rebase
          git push
